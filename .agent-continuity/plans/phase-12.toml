disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-12-002"
kind = "reviewer"
summary = "Asset GC repeated reference checks can share one SQLite read snapshot and miss concurrent committed references"
description = "Deletion safety checks must establish fresh read transactions and refuse sessions with pending writes before unlinking an orphan candidate."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[invariants]]
id = "INV-REPRO-001"
