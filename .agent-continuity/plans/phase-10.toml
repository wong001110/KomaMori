id = "P10-R01-C01"
description = "Manifest source items are persisted with explicit dispositions and mapped source items point to requirements"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P10-R01-C02"
description = "Scope Capture Gate fails on an unmapped material source"
evidence = ["test"]

[[requirements.checks]]
id = "P10-R01-C03"
description = "Reviewer findings can be registered immediately and remain unresolved until an explicit terminal disposition"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P10-R01-C04"
description = "A verified reviewer finding remains verified across an unchanged manifest resync unless explicitly reopened"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P10-R01-C05"
description = "A mapped source whose only requirement becomes inactive causes Scope Capture Gate failure instead of relying on historical mapping"
evidence = ["test", "review"]

[[requirements]]
id = "P10-R02"
title = "Invariant registry and impact-driven stale evidence"
disposition = "required"
