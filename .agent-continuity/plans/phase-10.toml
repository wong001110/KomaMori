manifest_version = 2
id = "phase-10"
project = "komamori"
title = "Agent Continuity v0.3 scope capture and reviewer gates"

[[sources]]
id = "SRC-10-001"
kind = "user"
summary = "Upgrade Agent Continuity and Execute mode so multi-item work is not silently dropped"
disposition = "mapped"
origin_ref = "current conversation"

[[sources]]
id = "FND-10-001"
kind = "reviewer"
summary = "v0.2 cannot prove that original intent was fully captured into the manifest"
description = "A source item omitted before manifest creation is invisible to the v0.2 completion gate."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-002"
kind = "reviewer"
summary = "Reviewer findings are not first-class durable state"
description = "Findings can remain only in chat/review prose and be lost during later phase planning."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-003"
kind = "reviewer"
summary = "Cross-cutting invariants are not tracked independently of feature requirements"
description = "Data and publication safety properties can be missed even when feature checks pass."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-004"
kind = "reviewer"
summary = "v0.2 has stale-evidence semantics but no runtime change-impact mapping"
description = "Later changes can affect a verified behavior without automatically making its evidence stale."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-005"
kind = "reviewer"
summary = "Execute mode lacks a mandatory fresh reviewer gate after checklist completion"
description = "A completion gate can pass while a new failure-path or invariant defect remains outside the manifest."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-006"
kind = "reviewer"
summary = "Legacy continuity CLI can bypass the v0.3 Fresh Reviewer Gate"
description = "Because scripts/continuity.py remains executable, direct legacy phase/task completion must be blocked at the durable-store layer for v0.3 phases."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-007"
kind = "reviewer"
summary = "Fresh Reviewer Gate ordering is not enforced at the durable-store layer"
description = "A reviewer-pass record must not be accepted before the current manifest has a passing Completion Gate for the same commit."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-008"
kind = "reviewer"
summary = "Manifest resync can regress an already verified reviewer finding back to mapped"
description = "ReviewFinding status is operational execution state and must survive an unchanged scope resync unless explicitly reopened."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-009"
kind = "reviewer"
summary = "A captured source can escape the gate if its mapped requirement is later removed"
description = "Capture Gate must require a mapped source to point to an active current requirement; historical mappings to inactive requirements are not sufficient."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-010"
kind = "reviewer"
summary = "A new fresh-review finding does not invalidate old capture/completion authority"
description = "Registering a material finding or changing its scope disposition must invalidate prior capture authority; later completion/review gates must occur after the latest successful recapture."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-10-011"
kind = "reviewer"
summary = "Region editor success feedback is cleared by its own server-state refresh"
description = "save/approve reload the selected region and the synchronization effect clears the operation message, making the full-stack E2E deterministically fail and hiding user feedback."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "SRC-10-002"
kind = "user"
summary = "Execute the KomaMori reliability fixes found by the latest reviewer pass"
disposition = "deferred"
reason = "First upgrade the continuity runtime so the reliability phase itself is captured and reviewer-gated with v0.3."
destination = "phase-11"
origin_ref = "current conversation"

[[invariants]]
id = "INV-CONT-001"
description = "Every material source or reviewer finding must have an explicit durable disposition before broad implementation."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-CONT-002"
description = "A v0.3 phase cannot finalize without capture gate, completion gate, and fresh reviewer gate for the accepted state."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-CONT-003"
description = "Changes to impacted modules must make affected prior verification stale until reverified."
severity = "P1"
status = "active"

[[requirements]]
id = "P10-R01"
title = "Durable source and reviewer-finding capture"
disposition = "required"
source_refs = ["SRC-10-001", "FND-10-001", "FND-10-002", "FND-10-008", "FND-10-009"]

[requirements.impacts]
domains = ["scope-capture", "review-findings"]
modules = [".agent-continuity/schema.sql", "scripts/continuity_v03.py"]
invariants = ["INV-CONT-001"]

