[[requirements.checks]]
id = "P10-R03-C02"
description = "Phase/task completion through the v0.3 runtime requires both completion and fresh reviewer gates for the accepted commit"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P10-R03-C03"
description = "Legacy v0.2 CLI cannot bypass v0.3 finalization guards at the SQLite state-store layer"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P10-R03-C04"
description = "A passing Fresh Reviewer Gate cannot be recorded before a passing Completion Gate exists for the current manifest and same commit"
