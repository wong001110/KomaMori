manifest_version = 2
id = "phase-11"
project = "komamori"
title = "Integrity and release semantics"

[[sources]]
id = "SRC-11-001"
kind = "user"
summary = "Execute the KomaMori reliability fixes found by the latest reviewer pass"
disposition = "mapped"
origin_ref = "SRC-10-002 / current conversation"

[[sources]]
id = "FND-11-001"
kind = "reviewer"
summary = "Filesystem mutations can commit before database state, leaving dangling durable asset references on rollback"
description = "Region edits/deletes, chapter/series deletion, re-analysis, masks and clean-page generation need commit-safe asset lifecycle semantics."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-002"
kind = "reviewer"
summary = "Unresolved unknown regions can coexist with locale Ready"
description = "Unknown regions should not count as translatable workload, but must block source review and Ready until explicitly classified or deleted."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-003"
kind = "reviewer"
summary = "Empty approvals and blocking QA errors can coexist with Ready"
description = "Approve must reject empty text and Ready must require translated=approved=total plus zero blocking deterministic QA errors."
severity = "P0"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-004"
kind = "reviewer"
summary = "Default self-host port binding exposes KomaMori beyond localhost without authentication"
description = "Compose should bind the web app to localhost by default; wider exposure must be explicit."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-005"
kind = "reviewer"
summary = "Page recovery lifecycle is missing"
description = "A wrong imported page currently requires destructive chapter recreation; users need page replace, delete and reorder recovery paths with correct invalidation."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-006"
kind = "reviewer"
summary = "Terminology policy changes do not invalidate previously approved localization state"
description = "Changing target/aliases/locked policy can leave stale approved translations and Ready state until manual QA."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-007"
kind = "reviewer"
summary = "CBZ and direct upload limits can be bypassed before decompressed/aggregate resource validation"
description = "Archive entries are read before uncompressed-size checks and direct uploads lack aggregate count/byte/pixel bounds."
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-008"
kind = "reviewer"
summary = "Application SQLite lacks WAL and busy timeout concurrency pragmas"
description = "FastAPI concurrent writes can hit avoidable database-is-locked failures."
severity = "P2"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-009"
kind = "reviewer"
summary = "Browser verification lacks negative release-invariant workflows"
description = "E2E should prove unknown source review and blocking terminology QA cannot produce Ready."
severity = "P2"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-010"
kind = "reviewer"
summary = "Frontend dependency resolution is not fully reproducible"
severity = "P2"
disposition = "deferred"
reason = "The current connected GitHub workflow cannot reliably generate and validate a new npm lockfile from registry resolution. Keep this explicit for dependency-hardening rather than hand-author a lockfile."
destination = "dependency-hardening"

[[sources]]
id = "FND-11-011"
kind = "reviewer"
summary = "OCR/LLM provider and prompt provenance is too thin for future model benchmarking"
severity = "P2"
disposition = "deferred"
reason = "This is experiment/data-lineage infrastructure rather than the current integrity/release safety scope."
destination = "experiment-observability"

[[sources]]
id = "FND-11-012"
kind = "reviewer"
summary = "Chapter display number is modeled as float and cannot represent real manga numbering cleanly"
severity = "P2"
disposition = "deferred"
reason = "Changing chapter identity/display/sort semantics is a product/schema redesign and is not required to make current lifecycle safe."
destination = "data-model-v2"

[[sources]]
id = "FND-11-013"
kind = "policy"
summary = "Main branch does not enforce PR and required CI checks through repository branch protection"
severity = "P2"
disposition = "deferred"
reason = "The connected GitHub tool exposes branch-protection/ruleset reads but no administration/write action, so this repository-policy mutation cannot be safely executed from the current tool boundary."
destination = "repository-policy"

[[invariants]]
id = "INV-DATA-001"
description = "A failed mutation must not leave committed database state referencing a required asset that was deleted before commit."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-READY-001"
description = "A locale cannot be Ready while any source TextRegion remains unresolved as unknown."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-READY-002"
description = "Ready requires every translatable region to contain nonempty approved text and zero blocking deterministic QA errors."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-APPROVAL-001"
description = "Empty localization cannot be approved and policy changes invalidate affected prior approvals/reuse memory."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-PAGE-001"
description = "Page replacement/deletion/reorder cannot preserve derived or localization state that belongs to an obsolete original page identity/order."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-UPLOAD-001"
description = "Untrusted direct/archive uploads cannot bypass configured page-count, byte, uncompressed-size or pixel limits before large allocation."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-SELFHOST-001"
description = "Default Docker Compose exposure binds KomaMori web only to localhost."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-SQLITE-001"
description = "File-backed application SQLite enables foreign keys, WAL and a bounded busy timeout."
severity = "P2"
status = "active"

[[requirements]]
id = "P11-R01"
title = "Commit-safe asset mutation lifecycle"
disposition = "required"
source_refs = ["SRC-11-001", "FND-11-001"]

[requirements.impacts]
domains = ["asset-lifecycle", "transactions", "processing"]
modules = ["apps/api/src/komamori/storage.py", "apps/api/src/komamori/routers/library.py", "apps/api/src/komamori/routers/processing.py"]
invariants = ["INV-DATA-001"]

[[requirements.checks]]
id = "P11-R01-C01"
description = "Region update/delete and chapter/series deletion commit database state before deleting previously referenced filesystem assets"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P11-R01-C02"
description = "replace=true analysis finishes OCR before destructive database replacement and a failed OCR leaves previous regions/derived assets intact"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P11-R01-C03"
description = "New mask/clean assets are generated at unique paths, referenced only after successful commit, and obsolete assets are cleaned only after commit"
evidence = ["test", "review"]

[[requirements]]
id = "P11-R02"
title = "Source-review and Ready correctness"
disposition = "required"
source_refs = ["FND-11-002", "FND-11-003", "FND-11-009"]

[requirements.impacts]
domains = ["readiness", "qa", "approval"]
modules = ["apps/api/src/komamori/routers/workbench.py", "apps/api/src/komamori/routers/localization.py", "apps/api/src/komamori/quality.py", "apps/web/src/Reader.tsx", "apps/web/e2e/workflow.spec.ts"]
invariants = ["INV-READY-001", "INV-READY-002", "INV-APPROVAL-001"]

[[requirements.checks]]
id = "P11-R02-C01"
description = "Any unresolved unknown region blocks Ready without inflating the translation denominator; explicitly classified SFX does not block"
evidence = ["test", "e2e", "review"]

[[requirements.checks]]
id = "P11-R02-C02"
description = "Approve endpoint rejects empty localization text and Ready requires translated == approved == total"
evidence = ["test"]

[[requirements.checks]]
id = "P11-R02-C03"
description = "Blocking deterministic QA errors are computed by shared quality logic and prevent Ready while warnings alone do not"
evidence = ["test", "e2e", "review"]

[[requirements]]
id = "P11-R03"
title = "Recoverable page lifecycle"
disposition = "required"
source_refs = ["FND-11-005"]

[requirements.impacts]
domains = ["page-lifecycle", "recovery"]
modules = ["apps/api/src/komamori/routers/library.py", "apps/api/src/komamori/schemas.py", "apps/api/src/komamori/storage.py", "apps/web/src/App.tsx", "apps/web/src/api.ts"]
invariants = ["INV-DATA-001", "INV-PAGE-001"]

[[requirements.checks]]
id = "P11-R03-C01"
description = "A single page can be replaced using a new original asset path; old regions/localizations/masks/clean state are invalidated and old files are removed only after commit"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P11-R03-C02"
description = "A page can be deleted and remaining page indexes are normalized without unique-index collisions or dangling assets"
evidence = ["test"]

[[requirements.checks]]
id = "P11-R03-C03"
description = "Chapter pages can be reordered with exact page-set validation and stable normalized indexes"
evidence = ["test"]

[[requirements.checks]]
id = "P11-R03-C04"
description = "Library UI exposes replace, delete and move/reorder recovery controls for imported pages"
evidence = ["build", "review"]

[[requirements]]
id = "P11-R04"
title = "Terminology policy invalidation"
disposition = "required"
source_refs = ["FND-11-006"]

[requirements.impacts]
domains = ["terminology", "approval", "reuse-memory"]
modules = ["apps/api/src/komamori/routers/localization.py", "apps/api/src/komamori/quality.py"]
invariants = ["INV-APPROVAL-001", "INV-READY-002"]

[[requirements.checks]]
id = "P11-R04-C01"
description = "Changing policy-relevant terminology fields conservatively demotes affected series/locale localizations to needs-review"
evidence = ["test"]

[[requirements.checks]]
id = "P11-R04-C02"
description = "Changing terminology policy clears affected approved-translation reuse memory so stale approved wording cannot be reused"
evidence = ["test", "review"]

[[requirements]]
id = "P11-R05"
title = "Upload, SQLite and self-host runtime safety"
disposition = "required"
source_refs = ["FND-11-004", "FND-11-007", "FND-11-008"]

[requirements.impacts]
domains = ["uploads", "sqlite", "self-host-security"]
modules = ["apps/api/src/komamori/storage.py", "apps/api/src/komamori/db.py", "compose.yaml"]
invariants = ["INV-UPLOAD-001", "INV-SELFHOST-001", "INV-SQLITE-001"]

[[requirements.checks]]
id = "P11-R05-C01"
description = "CBZ preflight validates entry count, individual/aggregate uncompressed bytes and image pixels before large archive allocation; direct uploads have count/aggregate limits"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P11-R05-C02"
description = "File-backed SQLite connections enable foreign_keys, WAL and busy_timeout"
evidence = ["test", "review"]

[[requirements.checks]]
id = "P11-R05-C03"
description = "Default Compose web port binding is localhost-only"
evidence = ["container", "review"]

[[requirements]]
id = "P11-R06"
title = "Release-invariant verification"
disposition = "required"
source_refs = ["FND-11-009", "SRC-11-001"]

[requirements.impacts]
domains = ["release-verification", "e2e"]
modules = ["apps/api/tests", "apps/web/e2e/workflow.spec.ts", ".github/workflows/ci.yml"]
invariants = ["INV-DATA-001", "INV-READY-001", "INV-READY-002", "INV-APPROVAL-001", "INV-PAGE-001", "INV-UPLOAD-001", "INV-SELFHOST-001", "INV-SQLITE-001"]

[[requirements.checks]]
id = "P11-R06-C01"
description = "Browser E2E proves an unresolved unknown region cannot present the locale as Ready"
evidence = ["e2e"]

[[requirements.checks]]
id = "P11-R06-C02"
description = "Browser E2E proves a blocking terminology QA error cannot present the locale as Ready"
evidence = ["e2e"]

[[requirements.checks]]
id = "P11-R06-C03"
description = "Backend regression suite covers transaction rollback/recovery, page lifecycle, readiness/approval, policy invalidation, upload limits and SQLite pragmas"
evidence = ["test", "review"]
