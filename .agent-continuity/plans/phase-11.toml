[[invariants]]
id = "INV-DATA-001"
description = "Failed mutations never leave durable DB references to required assets deleted before commit; partial new writes are cleaned when the writer fails."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-READY-001"
description = "A locale cannot be Ready while any source TextRegion remains unresolved as unknown."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-READY-002"
description = "Ready requires every translatable region to have nonempty approved text and zero blocking deterministic QA errors."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-APPROVAL-001"
description = "Empty localization cannot be approved and only valid translatable approvals may populate reuse memory; policy changes invalidate affected approval/reuse state."
severity = "P0"
status = "active"

[[invariants]]
id = "INV-PAGE-001"
description = "Page replacement removes content-bound region/localization/derived state; deletion removes the page state; reordering preserves page identity while normalizing indexes safely."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-UPLOAD-001"
description = "Untrusted uploads cannot bypass page-count, byte, uncompressed-size or pixel limits before large allocation."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-SELFHOST-001"
description = "Default Docker Compose exposure binds KomaMori web only to localhost."
severity = "P1"
status = "active"

[[invariants]]
id = "INV-SQLITE-001"
description = "File-backed application SQLite enables foreign keys, WAL and a bounded busy timeout."
severity = "P2"
status = "active"

[[requirements]]
id = "P11-R01"
title = "Commit-safe asset mutation lifecycle"
disposition = "required"
source_refs = ["SRC-11-001", "FND-11-001", "FND-11-014"]
[requirements.impacts]
domains = ["asset-lifecycle", "transactions", "processing"]
modules = ["apps/api/src/komamori/storage.py", "apps/api/src/komamori/routers/library.py", "apps/api/src/komamori/routers/processing.py"]
invariants = ["INV-DATA-001"]
[[requirements.checks]]
id = "P11-R01-C01"
description = "Region update/delete and chapter/series deletion commit DB state before deleting previously referenced assets"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R01-C02"
description = "replace analysis completes OCR before destructive replacement; failed OCR preserves old regions/derived assets"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R01-C03"
description = "New mask/clean assets use unique paths and obsolete assets are deleted only after successful commit"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R01-C04"
description = "Original/mask/clean writers remove partial new files when generation itself fails"
evidence = ["test", "review"]

[[requirements]]
id = "P11-R02"
title = "Source-review, approval and Ready correctness"
disposition = "required"
source_refs = ["FND-11-002", "FND-11-003", "FND-11-009", "FND-11-015"]
[requirements.impacts]
domains = ["readiness", "qa", "approval", "reuse-memory"]
modules = ["apps/api/src/komamori/routers/workbench.py", "apps/api/src/komamori/routers/localization.py", "apps/api/src/komamori/quality.py", "apps/web/src/RegionEditor.tsx", "apps/web/src/Reader.tsx", "apps/web/e2e/workflow.spec.ts"]
invariants = ["INV-READY-001", "INV-READY-002", "INV-APPROVAL-001"]
[[requirements.checks]]
id = "P11-R02-C01"
description = "Unknown blocks Ready without inflating translation denominator; explicitly classified SFX does not block"
evidence = ["test", "e2e", "review"]
[[requirements.checks]]
id = "P11-R02-C02"
description = "Approve rejects empty localization and Ready requires translated == approved == total"
evidence = ["test"]
[[requirements.checks]]
id = "P11-R02-C03"
description = "Blocking deterministic QA errors prevent Ready while warnings alone do not"
evidence = ["test", "e2e", "review"]
[[requirements.checks]]
id = "P11-R02-C04"
description = "Unknown/SFX and blocking-QA-invalid approvals are not inserted into approved-translation reuse memory, and UI reports approval vs reusable status accurately"
evidence = ["test", "e2e", "review"]

[[requirements]]
id = "P11-R03"
title = "Recoverable page lifecycle"
disposition = "required"
source_refs = ["FND-11-005"]
[requirements.impacts]
domains = ["page-lifecycle", "recovery"]
modules = ["apps/api/src/komamori/routers/library.py", "apps/api/src/komamori/storage.py", "apps/web/src/App.tsx", "apps/web/src/api.ts", "apps/web/src/page-recovery.css"]
invariants = ["INV-DATA-001", "INV-PAGE-001"]
[[requirements.checks]]
id = "P11-R03-C01"
description = "Single page replacement uses a new original path, invalidates old page content state, and cleans old files only after commit"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R03-C02"
description = "Page deletion normalizes remaining indexes without unique-index collisions or dangling assets"
evidence = ["test"]
[[requirements.checks]]
id = "P11-R03-C03"
description = "Page reorder requires the exact chapter page set and assigns stable normalized indexes"
evidence = ["test"]
[[requirements.checks]]
id = "P11-R03-C04"
description = "Library UI exposes usable replace, delete and move/reorder controls"
evidence = ["build", "review"]

[[requirements]]
id = "P11-R04"
title = "Terminology policy invalidation"
disposition = "required"
source_refs = ["FND-11-006"]
[requirements.impacts]
domains = ["terminology", "approval", "reuse-memory"]
modules = ["apps/api/src/komamori/routers/localization.py", "apps/api/src/komamori/quality.py"]
invariants = ["INV-APPROVAL-001", "INV-READY-002"]
[[requirements.checks]]
id = "P11-R04-C01"
description = "Policy-relevant terminology changes conservatively demote affected series/locale localizations to needs-review"
evidence = ["test"]
[[requirements.checks]]
id = "P11-R04-C02"
description = "Terminology policy changes clear affected approved-translation reuse memory"
evidence = ["test", "review"]

[[requirements]]
id = "P11-R05"
title = "Upload, SQLite and self-host runtime safety"
disposition = "required"
source_refs = ["FND-11-004", "FND-11-007", "FND-11-008"]
[requirements.impacts]
domains = ["uploads", "sqlite", "self-host-security"]
modules = ["apps/api/src/komamori/storage.py", "apps/api/src/komamori/db.py", "compose.yaml"]
invariants = ["INV-UPLOAD-001", "INV-SELFHOST-001", "INV-SQLITE-001"]
[[requirements.checks]]
id = "P11-R05-C01"
description = "Archive/direct uploads preflight count, per-page/aggregate bytes, uncompressed bytes and image pixels before unsafe allocation"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R05-C02"
description = "File-backed SQLite connections enable foreign_keys, WAL and busy_timeout"
evidence = ["test", "review"]
[[requirements.checks]]
id = "P11-R05-C03"
description = "Default Compose web binding is localhost-only"
evidence = ["container", "review"]

[[requirements]]
id = "P11-R06"
title = "Release-invariant verification"
disposition = "required"
source_refs = ["FND-11-009", "SRC-11-001"]
[requirements.impacts]
domains = ["release-verification", "e2e"]
modules = ["apps/api/tests", "apps/web/e2e/workflow.spec.ts", ".github/workflows/ci.yml"]
invariants = ["INV-DATA-001", "INV-READY-001", "INV-READY-002", "INV-APPROVAL-001", "INV-PAGE-001", "INV-UPLOAD-001", "INV-SELFHOST-001", "INV-SQLITE-001"]
[[requirements.checks]]
id = "P11-R06-C01"
description = "Browser E2E proves unresolved unknown cannot present Ready"
evidence = ["e2e"]
[[requirements.checks]]
id = "P11-R06-C02"
description = "Browser E2E proves blocking terminology QA cannot present Ready"
evidence = ["e2e"]
[[requirements.checks]]
id = "P11-R06-C03"
description = "Backend regression suite covers transaction recovery, writer cleanup, page lifecycle, readiness/approval, policy invalidation, upload limits and SQLite pragmas"
