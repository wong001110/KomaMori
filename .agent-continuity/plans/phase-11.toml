destination = "experiment-observability"

[[sources]]
id = "FND-11-012"
kind = "reviewer"
summary = "Chapter display number is modeled as float and cannot represent real manga numbering cleanly"
severity = "P2"
disposition = "deferred"
reason = "Changing display identity and sort semantics is a product/schema redesign, not required for current reliability."
destination = "data-model-v2"

[[sources]]
id = "FND-11-013"
kind = "policy"
summary = "Main branch does not enforce PR and required CI checks through branch protection"
severity = "P2"
disposition = "deferred"
reason = "The connected GitHub boundary exposes protection reads but no administration/write action."
destination = "repository-policy"

[[sources]]
id = "FND-11-014"
kind = "reviewer"
summary = "A writer can create a partial new asset and fail before its caller knows the path to clean"
severity = "P1"
disposition = "mapped"
finding_status = "mapped"

[[sources]]
id = "FND-11-015"
kind = "reviewer"
summary = "Approved status can pollute reuse memory for unknown/SFX or deterministic-QA-invalid translations"
