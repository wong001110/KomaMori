[[sources]]
id = "FND-11-010"
kind = "reviewer"
summary = "Frontend dependency resolution is not fully reproducible"
severity = "P2"
disposition = "deferred"
reason = "Do not hand-author an npm lockfile; generate and validate it in a dependency-hardening phase with registry tooling."
