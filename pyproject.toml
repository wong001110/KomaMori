[project]
name = "komamori"
version = "0.1.0"
description = "Self-hosted structured manga localization workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<12",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]
mangaocr = ["manga-ocr>=0.1.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q"
